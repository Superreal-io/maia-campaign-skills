<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Plantilla slot-based: WOW banner Movistar Plus+ 1920x640 (ratio 3:1).
     Layout 40/60: copy a la izquierda, visual a la derecha.
     CTA = link con underline y >, NUNCA boton pill.
     M azul top-left (fondo claro) o M blanco top-left (fondo oscuro/azul/foto).
     El modelo edita SOLO los textos y el data-prompt; los slots los rellena assemble.py -->
<style>
{{FONT_FACE_MIN}}
{{TOKENS_CSS}}

@page { size: 1920px 640px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 640px; overflow: hidden; }
body {
  font-family: "Movistar Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: var(--movistar-white, #FFFAF5);
  color: var(--movistar-black, #262423);
  position: relative;
}

/* Logo M top-left. Cambiar a {{LOGO_MARK_INVERSE}} si fondo oscuro/azul/foto */
.mark {
  position: absolute; top: 48px; left: 64px;
  width: 80px; height: auto; z-index: 10;
}

/* Zona izquierda ~40% para copy */
.copy-zone {
  position: absolute; top: 0; left: 0;
  width: 40%; height: 100%;
  padding: 140px 48px 48px 64px;
  display: flex; flex-direction: column; justify-content: center;
}
.overline {
  font-weight: 400; font-size: 18px; line-height: 1.3;
  color: var(--movistar-blue, #0066FF);
  margin-bottom: 12px;
}
.headline {
  font-weight: 800; font-size: 40px; line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--movistar-black, #262423);
  margin-bottom: 16px;
}
.price {
  font-weight: 800; font-size: 56px; line-height: 1;
  color: var(--movistar-black, #262423);
  margin-bottom: 8px;
}
.price small {
  font-size: 22px; font-weight: 700; vertical-align: super;
}
.price-old {
  font-weight: 400; font-size: 20px; color: #6F7176;
  text-decoration: line-through; margin-bottom: 12px;
}
.cta-link {
  font-weight: 700; font-size: 18px;
  color: var(--movistar-blue, #0066FF);
  text-decoration: underline;
  margin-top: 12px;
}

/* Zona derecha ~60% para visual */
.visual-zone {
  position: absolute; top: 0; right: 0;
  width: 60%; height: 100%;
  overflow: hidden;
}
.visual-zone img {
  width: 100%; height: 100%; object-fit: cover;
}

/* Partners (opcional) */
.partners {
  position: absolute; bottom: 48px; left: 64px;
  display: flex; gap: 16px; align-items: center;
}
.partners img { height: 28px; width: auto; }
</style>
</head>
<body>

  <!-- Logo M: usar {{LOGO_MARK}} (fondo claro) o {{LOGO_MARK_INVERSE}} (fondo oscuro/azul/foto) -->
  <img class="mark" src="{{LOGO_MARK}}" alt="Movistar">

  <!-- Zona de copy (izquierda ~40%) -->
  <div class="copy-zone">
    <div class="overline">[OVERLINE opcional: sentence case]</div>
    <h1 class="headline">[TITULAR: Bold, sentence case, 2-3 lineas max]</h1>
    <!-- Bloque de precio: borrar si no aplica -->
    <div class="price">XX<small>eur/mes</small></div>
    <div class="price-old">[Precio anterior tachado si hay descuento]</div>
    <!-- CTA: SIEMPRE link con > , nunca boton pill -->
    <div class="cta-link">[CTA texto] &gt;</div>
  </div>

  <!-- Zona visual (derecha ~60%) -->
  <div class="visual-zone">
    <img src="{{IMG:outputs/hero-wow.png}}"
         data-prompt="[descripcion Magic Prompt de la foto/visual]"
         data-refs="[Track A o B segun INDEX.md]" alt="">
  </div>

  <!-- Logos de partners: borrar si no aplica -->
  <!--
  <div class="partners">
    <img src="[partner-logo-1.svg]" alt="[Partner 1]">
    <img src="[partner-logo-2.svg]" alt="[Partner 2]">
  </div>
  -->

</body>
</html>
