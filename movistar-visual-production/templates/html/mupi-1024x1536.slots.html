<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Plantilla slot-based: MUPI / marquesina vertical 1024x1536 (ratio 2:3).
     OOH awareness: SIN CTA pill, SIN precio (salvo campana comercial explicita).
     M expresiva GRANDE (~10-12% del ancho, regla 6X de gran formato).
     Lectura a distancia (10 metros). Titular enorme, pocos elementos.
     El modelo edita SOLO los textos y el data-prompt; los slots los rellena assemble.py -->
<style>
{{FONT_FACE_MIN}}
{{TOKENS_CSS}}

@page { size: 1024px 1536px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1024px; height: 1536px; overflow: hidden; }
body {
  font-family: "Movistar Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: var(--movistar-white, #FFFAF5);
  color: var(--movistar-black, #262423);
  position: relative;
}

/* Foto de fondo a sangre (familia lifestyle/deporte/foto).
   Si la familia es "producto sobre azul", cambiar background a #0066FF
   y ocultar esta img. */
.bg-photo {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover; z-index: 0;
}

/* Overlay sutil para legibilidad del texto sobre foto */
.overlay {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.05) 0%,
    rgba(0,0,0,0.25) 100%
  );
  z-index: 1;
  /* Borrar este div si fondo es color plano, no foto */
}

/* Titular: el elemento dominante. Legible a 10m */
.headline {
  position: absolute; top: 120px; left: 64px; right: 64px;
  font-weight: 800; font-size: 84px; line-height: 1.05;
  letter-spacing: -0.02em;
  color: #FFFFFF;
  z-index: 5;
  /* Sobre fondo claro: color: #262423 o #0066FF */
}

/* Subtitular / claim (opcional) */
.claim {
  position: absolute; top: 460px; left: 64px; right: 64px;
  font-weight: 700; font-size: 28px; line-height: 1.2;
  color: #FFFFFF;
  z-index: 5;
  /* Borrar si no aplica */
}

/* Tagline al pie (opcional): "Estrena. Disfruta. Renueva. Repite." */
.tagline {
  position: absolute; bottom: 200px; left: 64px; right: 64px;
  font-weight: 400; font-size: 22px; line-height: 1.3;
  color: #FFFFFF;
  z-index: 5;
  /* Borrar si no aplica */
}

/* Logo M expresivo bottom-right, GRANDE (~10-12% del ancho = ~110px) */
.mark {
  position: absolute; bottom: 80px; right: 64px;
  width: 110px; height: auto; z-index: 10;
  /* Regla 6X exterior: M mas grande que en digital.
     Blanco sobre azul/oscuro/foto, azul sobre fondo claro */
}

/* Legal al pie (solo si hay precio o condicion, raro en OOH) */
.legal {
  position: absolute; bottom: 32px; left: 64px; right: 200px;
  font-weight: 400; font-size: 14px; line-height: 1.3;
  color: rgba(255,255,255,0.7);
  z-index: 5;
  /* Legible a 2 metros. Borrar si no hay precio/condicion */
}
</style>
</head>
<body>

  <!-- Foto de fondo a sangre.
       Para familia "producto sobre azul": borrar esta img,
       poner body background: #0066FF, y anadir producto como img posicionada. -->
  <img class="bg-photo" src="{{IMG:outputs/hero-mupi.png}}"
       data-prompt="[descripcion Magic Prompt: escena lifestyle/deporte/marca]"
       data-refs="[Track A o B segun INDEX.md, refs exterior/]" alt="">

  <!-- Overlay para legibilidad. Borrar si fondo es color plano -->
  <div class="overlay"></div>

  <!-- Titular: el elemento dominante. Legible a 10 metros -->
  <h1 class="headline">[TITULAR: ExtraBold, sentence case,
2-4 lineas. Enorme. Legible a distancia]</h1>

  <!-- Claim / subtitular: borrar si no aplica -->
  <div class="claim">[Claim secundario: Bold, ~1/4 del cuerpo del titular]</div>

  <!-- Tagline al pie: borrar si no aplica -->
  <div class="tagline">[Tagline: ej. "Estrena. Disfruta. Renueva. Repite."]</div>

  <!-- Logo M: {{LOGO_MARK_INVERSE}} (blanco) sobre foto/azul/oscuro.
       {{LOGO_MARK}} (azul) sobre fondo claro. -->
  <img class="mark" src="{{LOGO_MARK_INVERSE}}" alt="Movistar">

  <!-- Legal: solo si hay precio o condicion. Raro en OOH. -->
  <!-- <div class="legal">[Legal 8-10pt, legible a 2m]</div> -->

  <!-- RECORDATORIO: SIN boton CTA. SIN precio (salvo campana comercial).
       El MUPI es awareness, no respuesta directa. -->

</body>
</html>
