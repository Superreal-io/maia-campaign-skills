<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Plantilla slot-based: Stories Meta/Social 1080x1920 (9:16 vertical).
     SIN boton CTA pill (el CTA lo proporciona la plataforma nativa).
     M logo bottom-right (fondo claro) o top-right (fondo azul).
     Telefono 900 solo si el plan lo requiere.
     Legal minimo al pie (20-24px).
     El modelo edita SOLO los textos y el data-prompt; los slots los rellena assemble.py -->
<style>
{{FONT_FACE_MIN}}
{{TOKENS_CSS}}

@page { size: 1080px 1920px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body {
  font-family: "Movistar Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: var(--movistar-white, #FFFAF5);
  color: var(--movistar-black, #262423);
  position: relative;
}

/* Logo M top centrado */
.mark-top {
  position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
  width: 72px; height: auto; z-index: 10;
}

/* Logo M bottom-right (alternativa, fondo claro) */
.mark-bottom {
  position: absolute; bottom: 120px; right: 68px;
  width: 72px; height: auto; z-index: 10;
  display: none;
  /* Mostrar este y ocultar .mark-top si la composicion lo requiere */
}

/* Label "miMovistar" debajo del logo (convergente) */
.label {
  position: absolute; top: 150px; left: 0; right: 0;
  text-align: center;
  font-weight: 700; font-size: 24px;
  color: var(--movistar-blue, #0066FF);
}

/* Titular principal */
.headline {
  position: absolute; top: 220px; left: 68px; right: 68px;
  font-weight: 800; font-size: 72px; line-height: 1.08;
  letter-spacing: -0.01em;
  color: var(--movistar-black, #262423);
}

/* Specs en fila compacta: "Fibra 1Gb | 2 lineas 5G+ | TV" */
.specs {
  position: absolute; top: 520px; left: 68px; right: 68px;
  font-weight: 700; font-size: 28px; line-height: 1.3;
  color: var(--movistar-black, #262423);
}

/* Foto / producto (zona central) */
.hero {
  position: absolute; top: 620px; left: 0; right: 0;
  height: 520px; object-fit: cover; width: 100%;
}

/* Bloque inferior: precio + condicion + telefono */
.bottom-zone {
  position: absolute; bottom: 180px; left: 68px; right: 68px;
}

.price-overline {
  font-weight: 400; font-size: 24px;
  color: var(--movistar-blue, #0066FF);
  margin-bottom: 4px;
}
.price {
  font-weight: 800; font-size: 96px; line-height: 1;
  color: var(--movistar-black, #262423);
}
.price small {
  font-size: 36px; font-weight: 700; vertical-align: super;
}
.price-old {
  font-weight: 400; font-size: 32px; color: #6F7176;
  text-decoration: line-through; margin-top: 4px;
}
.condition {
  font-weight: 400; font-size: 24px; color: var(--movistar-black, #262423);
  margin-top: 8px;
}

/* Telefono de ayuda (solo si el plan lo requiere, NO en feed) */
.phone {
  position: absolute; bottom: 100px; left: 68px; right: 68px;
  font-weight: 400; font-size: 22px;
  color: var(--movistar-black, #262423);
  /* Borrar si no aplica */
}

/* Legal al pie */
.legal {
  position: absolute; bottom: 32px; left: 68px; right: 68px;
  font-weight: 400; font-size: 20px; line-height: 1.3;
  color: #6F7176;
}

/* Badge de ahorro (opcional, dispositivos/swap) */
.badge-ahorro {
  display: inline-block;
  background: #00C48C;
  color: #FFFFFF;
  font-weight: 700; font-size: 22px;
  padding: 8px 20px;
  border-radius: 20px;
  margin-top: 12px;
}
</style>
</head>
<body>

  <!-- Logo M centrado arriba -->
  <img class="mark-top" src="{{LOGO_MARK}}" alt="Movistar">
  <!-- Alternativa: logo M bottom-right (descomentar y ocultar mark-top) -->
  <!-- <img class="mark-bottom" src="{{LOGO_MARK}}" alt="Movistar"> -->

  <!-- Label miMovistar (convergente). Borrar si no aplica -->
  <div class="label">miMovistar</div>

  <!-- Titular -->
  <h1 class="headline">[TITULAR: ExtraBold, sentence case,
2-4 lineas, una <span style="color:#0066FF;">keyword en azul</span> max]</h1>

  <!-- Specs en linea (convergente). Borrar si no aplica -->
  <div class="specs">[Fibra 1Gb | 2 lineas 5G+ | TV]</div>

  <!-- Foto lifestyle o productos cutout -->
  <img class="hero" src="{{IMG:outputs/hero-story.png}}"
       data-prompt="[descripcion Magic Prompt]"
       data-refs="[Track A o B segun INDEX.md]" alt="">

  <!-- Bloque inferior: precio -->
  <div class="bottom-zone">
    <div class="price-overline">[Desde]</div>
    <div class="price">XX<small>eur/mes</small></div>
    <div class="price-old">[Precio anterior tachado]</div>
    <div class="condition">[Sin permanencia]</div>
    <!-- Badge ahorro: borrar si no aplica -->
    <!-- <div class="badge-ahorro">Ahorra hasta XX eur</div> -->
  </div>

  <!-- Telefono 900: solo si el plan lo requiere -->
  <div class="phone">Llama gratis al 900 XXX XXX</div>

  <!-- Legal minimo al pie -->
  <div class="legal">[Legal: condiciones minimas, 20-24px]</div>

  <!-- RECORDATORIO: SIN boton CTA pill. El CTA es nativo de la plataforma.
       SIN emojis en la pieza visual.
       SIN URL ni "visita movistar.es" -->

</body>
</html>
